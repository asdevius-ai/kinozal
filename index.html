<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Кінозал</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand" id="brand">▶ Кінозал</div>
    <input id="search" type="search" placeholder="Пошук фільму…" autocomplete="off">
    <div class="filters">
      <select id="genre"><option value="">Усі жанри</option></select>
      <select id="sort">
        <option value="popularity.desc">Популярні</option>
        <option value="vote_average.desc">За рейтингом</option>
        <option value="primary_release_date.desc">Новіші</option>
        <option value="revenue.desc">Касові</option>
      </select>
      <input id="year" type="number" min="1900" max="2100" placeholder="Рік">
    </div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="popular" class="active">Популярні</button>
    <button data-tab="trending">Тренди тижня</button>
    <button data-tab="top_rated">Найкращі</button>
    <button data-tab="now_playing">Зараз у кіно</button>
    <button data-tab="upcoming">Скоро</button>
    <button data-tab="favorites">Обране</button>
    <button data-tab="continue">Продовжити</button>
  </nav>

  <main>
    <section id="keyBox" class="keybox hidden">
      <h2>Потрібен ключ TMDB</h2>
      <p>Створи безкоштовний ключ на <a href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener">themoviedb.org/settings/api</a> і встав сюди (v3 API Key або v4 Read Access Token).</p>
      <form id="keyForm">
        <input id="keyInput" type="text" placeholder="Ключ TMDB" autocomplete="off">
        <button type="submit">Зберегти</button>
      </form>
      <p class="muted">Ключ зберігається лише у твоєму браузері. Або впиши його у <code>config.js</code>.</p>
    </section>

    <h1 id="heading" class="heading"></h1>
    <div id="grid" class="grid"></div>
    <div id="status" class="status"></div>
    <div class="more-wrap"><button id="more" class="btn hidden" type="button">Показати ще</button></div>
    <div id="sentinel"></div>
  </main>

  <div id="details" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-body" id="detailsBody"></div>
  </div>

  <div id="player" class="modal hidden" role="dialog" aria-modal="true">
    <div class="player-body">
      <button class="close" data-close="player" aria-label="Закрити">✕</button>
      <div id="playerStage"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="player.js"></script>
  <script src="app.js"></script>
</body>
</html>
